name: Build Windows v1.1 preview

on:
  push:
    branches:
      - windows-v1.1-development
    paths:
      - '3D_Print_Cost.py'
      - 'windows_v11.py'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller openpyxl
      - name: Verify Python syntax and cost formulas
        shell: pwsh
        run: |
          python -m py_compile 3D_Print_Cost.py windows_v11.py
          python -c "import sqlite3; from windows_v11 import install_schema, cost_snapshot; from pathlib import Path; import tempfile; class_db=type('DB',(),{}); d=class_db(); d.conn=sqlite3.connect(':memory:'); d.conn.execute('CREATE TABLE settings (key TEXT PRIMARY KEY,value TEXT NOT NULL)'); d.get_setting=lambda k: (lambda row: row[0] if row else None)(d.conn.execute('SELECT value FROM settings WHERE key=?',(k,)).fetchone()); d.set_setting=lambda k,v: (d.conn.execute('INSERT OR REPLACE INTO settings VALUES (?,?)',(k,str(v))),d.conn.commit()); install_schema(d); d.conn.execute('INSERT INTO additional_costs(category,name,amount,enabled) VALUES (?,?,?,?)',('packaging','Box',1.4,1)); d.conn.commit(); x=cost_snapshot(d,{'total':3.75,'material_cost':3.5,'energy_cost':0.25}); assert abs(x['total']-5.15)<1e-8 and abs(x['price']-6.695)<1e-8; print('Cost test passed')"
      - name: Build standalone Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 3D_Print_Cost --icon 3D_Print_Cost.ico --add-data "3D_Print_Cost.ico;." 3D_Print_Cost.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Cost-v1.1-Windows-preview
          path: dist/3D_Print_Cost.exe
          if-no-files-found: error
